# SEC-1: Off-site backup of oi-production → Cloudflare R2.
# Nightly at 10:00 UTC (3:00 AM Arizona, MST UTC-7, no DST). workflow_dispatch remains.
name: OI production offsite backup

on:
  workflow_dispatch:
    inputs:
      force_monthly:
        description: "Also write monthly/ copy"
        type: boolean
        default: false
  schedule:
    # 10:00 UTC = 3:00 AM Arizona (MST, UTC-7, no daylight saving).
    - cron: "0 10 * * *"

permissions:
  contents: read

concurrency:
  group: oi-production-offsite-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client tools
        run: |
          bash scripts/offsite-backup/install-pg17-client.sh
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -qq python3-cryptography
          python3 -m pip install --user --break-system-packages 'awscli==1.36.40'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run off-site backup
        env:
          OI_PROD_DATABASE_URL: ${{ secrets.OI_PROD_DATABASE_URL }}
          OI_PROD_SUPABASE_URL: ${{ secrets.OI_PROD_SUPABASE_URL }}
          OI_PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OI_PROD_SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SEC1_FORCE_MONTHLY: ${{ inputs.force_monthly && '1' || '' }}
        run: bash scripts/offsite-backup/backup.sh

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BACKUP_ALERT_TO: ${{ secrets.BACKUP_ALERT_TO }}
          BACKUP_ALERT_FROM: ${{ secrets.BACKUP_ALERT_FROM }}
          BACKUP_ALERT_SUBJECT: "OI backup FAILED"
        run: bash scripts/offsite-backup/alert-failure.sh
