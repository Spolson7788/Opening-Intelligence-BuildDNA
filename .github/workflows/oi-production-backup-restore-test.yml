# SEC-1: Restore the newest oi-production R2 snapshot into throwaway Postgres 17.
# Never production or staging. Synthetic mode is an explicit opt-in only.
name: OI production backup restore test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "r2 (newest snapshots/YYYY-MM-DD from R2) or synthetic (explicit offline fixture only)"
        required: false
        type: choice
        options:
          - r2
          - synthetic
        default: r2

permissions:
  contents: read

jobs:
  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oi_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client tools
        run: |
          bash scripts/offsite-backup/install-pg17-client.sh
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          python3 -m pip install --user --break-system-packages 'awscli==1.36.40'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Wait for Postgres 17
        run: |
          export PATH="/usr/lib/postgresql/17/bin:${PATH}"
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              break
            fi
            if [[ "$i" -eq 30 ]]; then
              exit 1
            fi
            sleep 1
          done
          version="$(psql "postgresql://postgres:postgres@localhost:5432/oi_restore_test" -v ON_ERROR_STOP=1 -tAc 'SHOW server_version_num')"
          version="${version//[[:space:]]/}"
          [[ "$version" =~ ^17[0-9]{4}$ ]]
          pg_restore --version | grep -q '(PostgreSQL) 17\.'
          pg_dump --version | grep -q '(PostgreSQL) 17\.'

      - name: Run restore test
        env:
          # An omitted workflow_dispatch input is the newest real snapshot.
          SEC1_MODE: ${{ inputs.mode || 'r2' }}
          SEC1_TARGET_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oi_restore_test
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/offsite-backup/restore-test.sh

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BACKUP_ALERT_TO: ${{ secrets.BACKUP_ALERT_TO }}
          BACKUP_ALERT_FROM: ${{ secrets.BACKUP_ALERT_FROM }}
          BACKUP_ALERT_SUBJECT: "OI backup restore-test FAILED"
        run: bash scripts/offsite-backup/alert-failure.sh
